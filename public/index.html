<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pattinaggio">
<meta name="robots" content="noindex">
<title>Pattinaggio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
  // tema e accessibilità prima del primo disegno (niente lampo chiaro con il tema Scuro); il resto lo fa a11y.js
  try { var p = JSON.parse(localStorage.getItem("pg_a11y")) || {}, r = document.documentElement;
    if (p.theme === "dark" || p.theme === "light") r.setAttribute("data-theme", p.theme);
    if (p.contrast) r.setAttribute("data-contrast", "more"); if (p.motion) r.setAttribute("data-motion", "reduce"); } catch (e) {}
  // iPhone, app aperta dall'icona sulla Home: in alcune versioni di iOS l'area della pagina è più corta dello
  // schermo (di quanto è alta la zona dell'orologio) e ciò che è agganciato in basso resta sospeso.
  // Si misura lo spazio mancante e la barra in basso, i pannelli e gli avvisi lo recuperano (--vgap).
  (function () {
    function gap() {
      var g = 0, standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
      if (standalone && document.body) {
        var p = document.createElement("div");
        p.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top)";
        document.body.appendChild(p);
        var top = parseFloat(getComputedStyle(p).paddingTop) || 0; p.remove();
        var full = innerWidth > innerHeight ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        // solo se la pagina parte da sotto l'orologio (top > 0) e manca davvero un pezzo in fondo
        if (top > 0) g = Math.max(0, Math.min(full - innerHeight, 120));
      }
      document.documentElement.style.setProperty("--vgap", g + "px");
    }
    addEventListener("DOMContentLoaded", gap); addEventListener("resize", gap); addEventListener("orientationchange", function () { setTimeout(gap, 300); });
  })();
</script>
</head>
<body>
<main id="app"></main>
<div id="sheet" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
