# Pubblica la cartella public/ su GitHub Pages ad ogni modifica del branch principale.
# Impostazione una tantum: Settings → Pages → Source = "GitHub Actions".
name: Pubblica su GitHub Pages
on:
  push:
    branches: ["(root)"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
