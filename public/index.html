<!DOCTYPE html>
<html lang="it" class="beta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ede1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12132b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pattinaggio">
<meta name="robots" content="noindex">
<title>Pattinaggio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
  // tema e accessibilità prima del primo disegno (niente lampo chiaro con il tema Scuro); il resto lo fa a11y.js
  try { var p = JSON.parse(localStorage.getItem("pg_a11y")) || {}, r = document.documentElement;
    if (p.theme === "dark" || p.theme === "light") r.setAttribute("data-theme", p.theme);
    if (p.contrast) r.setAttribute("data-contrast", "more"); if (p.motion) r.setAttribute("data-motion", "reduce"); } catch (e) {}
</script>
</head>
<body>
<main id="app"></main>
<div id="sheet" hidden></div>
<script>
  // se app.js non parte (iOS troppo vecchio o file non scaricati) dopo 20 secondi lo dice, con la versione di iOS
  setTimeout(function () {
    if (window.__appStarted) return;
    var m = navigator.userAgent.match(/OS (\d+)_(\d+)/), v = m ? "iOS " + m[1] + "." + m[2] : navigator.userAgent.slice(0, 120);
    document.getElementById("app").innerHTML = '<div class="center stuck" role="alert"><p><b>L\'app non riesce ad aprirsi.</b></p>' +
      '<p>Controlla la connessione e riprova. Se succede ancora, manda una foto di questa schermata a chi gestisce l\'app.</p>' +
      '<p class="muted small">Non partita · ' + v + '</p><p><button class="btn" onclick="location.reload()">Riprova</button></p></div>';
  }, 20000);
</script>
<script type="module" src="app.js"></script>
</body>
</html>
